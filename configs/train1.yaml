model_root: '/home/user/weights/FitDiT'
pretrained_model_name_or_path: '/home/user/weights/FitDiT'

data:
  train_batch_size: 1
  dataloader_num_workers: 0
  height: 1024
  width: 768
  image_list: ['/home/user/FitDiT-train/data.json']

variant: 'fp16'
save_weight_dtype: 'float32'
mixed_precision: 'fp16'

enable_model_cpu_offload: True
set_grads_to_none: True
enable_xformers_memory_efficient_attention: False
gradient_checkpointing: True

mode_scale: 1.29
logit_std: 1.0
logit_mean: 0.0
weighting_scheme: 'logit_normal'

proportion_empty_prompts: 0.1
guidance_scale: 3.5

seed: 8888
checkpoints_total_limit: 5
checkpointing_steps: 50
max_train_steps: 500
gradient_accumulation_steps: 1
lr_warmup_steps: 50
lr_scheduler: 'cosine'  # Changed to cosine for better convergence
learning_rate: 5.0e-5   # Slightly increased
scale_lr: False

# optimizer
use_adafactor: True
use_8bit_adam: False
adam_beta1: 0.9
adam_beta2: 0.999
adam_weight_decay: 1.0e-2
adam_epsilon: 1.0e-8
max_grad_norm: 1.0

resume_from_checkpoint: ''
output_dir: '/home/user/weights'